<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Hunters Lab · Reading Tracks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css?v=d5">
</head>
<body>

<header class="site-header">
  <a class="brand" href="https://jehanzebwaqar.com/">Particle Hunters Lab</a>
  <span class="sep" aria-hidden="true">·</span>
  <span class="exercise">Reading Tracks</span>
</header>

<main class="lab">
  <section class="event-bar" aria-label="Event header" aria-live="polite">
    <span class="eb-item eb-main" id="eb-index">Event –</span>
    <span class="eb-item"><span class="eb-k">Run</span> <span id="eb-run">–</span></span>
    <span class="eb-item"><span class="eb-k" title="ATLAS gives every collision in a run its own number">ATLAS event</span> <span id="eb-event">–</span></span>
    <span class="eb-item" id="eb-date"></span>
    <span class="badge" id="badge">–</span>
    <span class="eb-item eb-met">
      <span class="eb-k">Missing energy</span>
      <span id="eb-met">–</span>
      <svg class="eb-arrow" id="eb-arrow" viewBox="-12 -12 24 24" width="22" height="22" aria-hidden="true"><circle r="11" /><path d="M-7 0H6M2-4l4 4-4 4" /></svg>
      <span id="eb-dir" title="Direction in the end view: an angle around the beam, counted anticlockwise from the right (0° = right, 90° = up). Physicists call this angle φ (phi)."></span>
    </span>
  </section>

  <section class="display" aria-label="Detector views">
    <figure class="view">
      <figcaption><span class="title">End view <span>looking down the beam</span></span><span class="zoom"><label for="zoom-end">Zoom</label><input type="range" id="zoom-end" min="0" max="100" value="0" aria-label="Zoom the end view"><output id="zoom-end-val" for="zoom-end">×1.0</output><button class="btn btn-sm" type="button" id="reset-end">Reset</button></span></figcaption>
      <div class="stage" id="stage-end"><canvas></canvas></div>
    </figure>
    <figure class="view">
      <figcaption><span class="title">Side view <span>ρ–z, barrel and end-caps</span></span><span class="zoom"><label for="zoom-side">Zoom</label><input type="range" id="zoom-side" min="0" max="100" value="0" aria-label="Zoom the side view"><output id="zoom-side-val" for="zoom-side">×1.0</output><button class="btn btn-sm" type="button" id="reset-side">Reset</button></span></figcaption>
      <div class="stage" id="stage-side"><canvas></canvas></div>
    </figure>

    <div class="layers" role="group" aria-label="Show or hide parts of the event">
      <span class="lbl">Show</span>
      <label class="switch"><input type="checkbox" id="show-tracks" checked><i class="sw line" style="--c:#dfe5ea"></i>Tracks</label>
      <label class="switch"><input type="checkbox" id="show-deposits" checked><i class="sw" style="--c:#ffd84d"></i>Energy deposits</label>
      <label class="switch"><input type="checkbox" id="show-hits" checked><i class="sw" style="--c:#ff5a5a"></i>Muon-chamber hits</label>
      <label class="switch"><input type="checkbox" id="show-jets"><i class="sw" style="--c:#3f7fd0"></i>Jets</label>
      <label class="switch"><input type="checkbox" id="show-met" checked><i class="sw dash" style="--c:#ff6b6b"></i>Missing energy</label>
    </div>

    <div class="legend" aria-label="Colour key: detector parts">
      <span><i class="sw" style="--c:#2b3238"></i>Inner detector</span>
      <span><i class="sw" style="--c:#7fbf7a"></i>Electromagnetic calorimeter</span>
      <span><i class="sw" style="--c:#c8655d"></i>Hadronic calorimeter</span>
      <span><i class="sw" style="--c:#4f80c4"></i>Muon chambers</span>
    </div>
  </section>

  <aside class="event-info" aria-label="Event information">
    <h2>Event</h2>
    <div class="nav">
      <button class="btn" id="prev" type="button" disabled>← Previous</button>
      <button class="btn" id="next" type="button" disabled>Next →</button>
    </div>
    <label class="pick">Go to <select class="btn" id="pick" disabled></select></label>
    <p class="counter" id="counter" aria-live="polite">Event –/–</p>
    <p class="placeholder" id="load-note"></p>
    <h2 class="status-head">Status</h2>
    <ol class="status" id="status" aria-live="polite"></ol>
  </aside>

  <section class="objects" aria-label="Object table">
    <h2>Tracks <span class="obj-count" id="obj-count"></span></h2>
    <div class="table-wrap">
      <table class="obj-table" id="obj-table">
        <thead>
          <tr>
            <th scope="col" class="num">#</th>
            <th scope="col"><span class="sym">p</span><button class="tip" type="button" aria-label="What is p?" data-tip="Momentum: how much 'push' the particle carries, in GeV. Heavier or faster particles have more."></button><span class="cap">momentum</span></th>
            <th scope="col"><span class="sym">p<sub>T</sub></span><button class="tip" type="button" aria-label="What is pT?" data-tip="Transverse momentum: the part of the momentum that goes sideways, across the beam, in GeV. This is the part you see in the end view."></button><span class="cap">across beam</span></th>
            <th scope="col"><span class="sym">η</span><button class="tip" type="button" aria-label="What is η?" data-tip="Pseudorapidity (eta): how far the track tilts toward either end of the detector. 0 means straight out sideways; big numbers (+ or −) mean close to the beam."></button><span class="cap">tilt</span></th>
            <th scope="col"><span class="sym">φ</span><button class="tip" type="button" aria-label="What is φ?" data-tip="Phi: the direction around the beam in the end view, in degrees, counted anticlockwise from the right (0° = right, 90° = up)."></button><span class="cap">direction</span></th>
            <th scope="col"><span class="sym">θ</span><button class="tip" type="button" aria-label="What is θ?" data-tip="Theta: the angle between the track and the beam, in degrees. 90° means straight out sideways; near 0° or 180° means close to the beam."></button><span class="cap">angle to beam</span></th>
            <th scope="col"><span class="sym">q</span><button class="tip" type="button" aria-label="What is q?" data-tip="Charge: + or −. You can tell from which way the track bends in the magnetic field."></button><span class="cap">charge</span></th>
          </tr>
        </thead>
        <tbody id="obj-rows"></tbody>
      </table>
    </div>
    <p class="tip-box" id="tip-box" role="tooltip" hidden></p>
  </section>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
  }
}
</script>

<script>
  // Show any error in the status list, so it can be reported without opening developer tools.
  (function () {
    function add(msg) {
      var li = document.createElement('li');
      li.className = 'bad';
      li.textContent = msg;
      var list = document.getElementById('status');
      if (list) list.appendChild(li);
    }
    window.addEventListener('error', function (e) {
      add('Error: ' + (e.message || e.type) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      add('Error: ' + ((e.reason && e.reason.message) || e.reason));
    });
  })();
</script>

<script type="module" src="js/main.js?v=d5"></script>

</body>
</html>
